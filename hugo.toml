baseURL = 'https://heimaeden.com'
locale = 'en-us'
hasCJKLanguage = false
title = 'HeimaEden'
theme = 'PaperMod'

# 开启标签和分类功能
[taxonomies]
category = 'categories'
tag = 'tags'

# 🛑 关键配置：强行开启全站生成 JSON 索引文件，激活 PaperMod 的本地极速搜索功能
[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
mainSections = ["posts"] # 👈 告诉主页，这些目录下的内容都要在主页流中展示
# 👇 强行开启黑夜/白天模式切换功能
defaultTheme = "auto"         # "auto" 代表自动根据老外用户的系统皮肤切换，同时允许手动点亮
ShowThemeToggle = true        # 👈 必须确保这一行是 true，开启右上角图标的点击 JS 响应
ShowBreadCrumbs = false   # 👈 强行关闭显示物理路径面包屑

ShowShareButtons = true        # 开启文章末尾精美的社交分享图标
ShowCodeCopyButtons = true     # 代码块右上角一键复制按钮
ShowReadingTime = true         # 友好展示阅读时间

# 👇 页面导航栏模板配置（修正版：显式区分 name 和 url，破除二义性）
[[menu.main]]
identifier = "payment-menu"         # 显式定义唯一的 ID，防止二义性冲突
name = "Payment"
url = "/categories/payment/"
weight = 10

[[menu.main]]
identifier = "static-site-menu"     # 显式定义唯一的 ID
name = "Static Site"
url = "/categories/static-site/"
weight = 20

[[menu.main]]
identifier = "archives-menu"
name = "Archives"
url = "/archives/"       # 👈 改为相对路径 "archives"，不加前后的斜杠
weight = 30

[[menu.main]]
identifier = "search-menu"
name = "Search"
url = "/search/"         # 👈 改为相对路径 "search"
weight = 40

[[menu.main]]
identifier = "about-menu"
name = "About"
url = "/about/"
weight = 45

[[menu.main]]
identifier = "contact-menu"
name = "Contact"
url = "/contact/"
weight = 46

# 👇 自定义页脚合规菜单（专为 HeimaEden 打造）
# 👇 自定义页脚合规菜单（完美对齐 legal 目录路径）
[params.footer_menu]
enable = true
[[params.footer_menu.items]]
name = "Privacy Policy"
url = "/legal/privacy-policy/"
[[params.footer_menu.items]]
name = "Cookie Policy"
url = "/legal/cookie-policy/"
[[params.footer_menu.items]]
name = "Terms of Service"
url = "/legal/terms-of-service/"
[[params.footer_menu.items]]
name = "Affiliate Disclosure"
url = "/legal/affiliate-disclosure/"



