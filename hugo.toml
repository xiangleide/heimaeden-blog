baseURL = 'https://heimaeden.com'
locale = 'en-us'
title = 'HeimaEden'
theme = 'PaperMod'

# 开启标签和分类功能
[taxonomies]
category = 'categories'
tag = 'tags'

# 🛑 关键配置：强行开启全站生成 JSON 索引文件，激活 PaperMod 的本地极速搜索功能
[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
mainSections = ["posts", "legal"] # 👈 告诉主页，这些目录下的内容都要在主页流中展示

# 👇 页面导航栏模板配置（修正版：显式区分 name 和 url，破除二义性）
[[menu.main]]
identifier = "payment-menu"         # 显式定义唯一的 ID，防止二义性冲突
name = "Payment"
url = "/categories/payment/"
weight = 10

[[menu.main]]
identifier = "static-site-menu"     # 显式定义唯一的 ID
name = "Static Site"
url = "/categories/static-site/"
weight = 20

[[menu.main]]
identifier = "archives-menu"
name = "Archives"
url = "/archives/"       # 👈 改为相对路径 "archives"，不加前后的斜杠
weight = 30

[[menu.main]]
identifier = "search-menu"
name = "Search"
url = "/search/"         # 👈 改为相对路径 "search"
weight = 40

# 👇 自定义页脚合规菜单（专为 HeimaEden 打造）
# 👇 自定义页脚合规菜单（完美对齐 legal 目录路径）
# 👇 自定义页脚合规菜单（终极修正：去掉最前面的斜杠，改用纯相对路径）
[params.footer_menu]
enable = true
[[params.footer_menu.items]]
name = "Privacy Policy"
url = "legal/privacy-policy/"        # 👈 删掉最前面的斜杠
[[params.footer_menu.items]]
name = "Cookie Policy"
url = "legal/cookie-policy/"         # 👈 删掉最前面的斜杠
[[params.footer_menu.items]]
name = "Terms of Service"
url = "legal/terms-of-service/"     # 👈 删掉最前面的斜杠
[[params.footer_menu.items]]
name = "Affiliate Disclosure"
url = "legal/affiliate-disclosure/"   # 👈 删掉最前面的斜杠



